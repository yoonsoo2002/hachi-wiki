name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 자동 테스트
        run: npm test
      - name: 버전 파일 생성 확인
        run: node scripts/write-version.mjs
